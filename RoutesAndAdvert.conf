<VirtualHost *:8082>
    ServerAdmin webmaster@localhost
    ServerName routesandadvert.vcpserver.net.ua

    DocumentRoot /var/www/RoutesAndAdvert
    LimitRequestLine 99999

    <Directory /var/www/RoutesAndAdvert>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex Manager.php login.php index.php index.html
    </Directory>

    # HTTP-кеш браузера для рекламних відео/зображень (URL /videos/…)
    # Потрібен увімкнений модуль: sudo a2enmod headers && sudo systemctl reload apache2
    <Directory "/var/www/RoutesAndAdvert/videos">
        Options -Indexes
        Require all granted
        <IfModule mod_headers.c>
            # 24 год; якщо при зміні ролика змінюється ім’я файлу — можна збільшити (напр. 31536000) + immutable
            Header set Cache-Control "public, max-age=86400"
        </IfModule>
    </Directory>

    # Опційно: не кешувати JSON API довго (розкоментуйте, якщо Apache перебиває заголовки PHP)
    # <Location "/api/">
    #     Header set Cache-Control "no-store, no-cache, must-revalidate"
    # </Location>

    # Максимальний розмір завантаження файлів (для відео реклами)
    <IfModule mod_php.c>
        php_value upload_max_filesize 100M
        php_value post_max_size 105M
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/RoutesAndAdvert_error.log
    CustomLog ${APACHE_LOG_DIR}/RoutesAndAdvert_access.log combined
</VirtualHost>

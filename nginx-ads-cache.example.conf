# Приклад для nginx: статика /videos/ + CORS для fetch() у player.js
# Підключіть у server { ... } (порт 8082, root /var/www/RoutesAndAdvert).
#
# ВАЖЛИВО: .htaccess у /videos/ Apache НЕ читає — CORS треба задати тут.
# player.js відкривається через file:// або з іншого origin і робить fetch() до /videos/…

location ^~ /videos/ {
    alias /var/www/RoutesAndAdvert/videos/;
    autoindex off;

    # CORS (аналог .htaccess: Access-Control-Allow-Origin / -Methods)
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, Content-Type";

    # Preflight для fetch()
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Access-Control-Max-Age 86400;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    # HTTP-кеш браузера (як у RoutesAndAdvert.conf для Apache)
    add_header Cache-Control "public, max-age=86400";

    # Відео — Range-запити; gzip для mp4 не потрібен
    gzip off;
}

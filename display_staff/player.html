        <div id="log">

<script>
    // Get 'imei' parameter from URL
    function getQueryParam(param) {
        const params = new URLSearchParams(window.location.search);
        return params.get(param) || '';
    }

    const imei = getQueryParam("imei");

    if (!imei) {
        // Show alert and possibly stop rendering the rest of the page
        document.body.innerHTML = "<div style='margin:1em;font-size:1.5em;color:white;'>Укажіть imei в параметрі URL, наприклад: ?imei=354018114690435</div>";
        // Alternatively, you can stop further js execution if needed:
        throw new Error("IMEI parameter required");
    }
</script>
